<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebGrab // Universal Asset Downloader</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⬇</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="header">
      <div class="logo">
        <span class="logo-bracket">[</span>
        <span class="logo-text">WebGrab</span>
        <span class="logo-bracket">]</span>
      </div>
      <div class="subtitle">Universal Asset Downloader &middot; v1.0</div>
    </header>

    <!-- URL Input -->
    <section class="input-section">
      <div class="input-wrapper">
        <span class="prompt">$&gt;</span>
        <input type="text" id="urlInput" placeholder="paste target URL here..." autocomplete="off" spellcheck="false">
        <button id="scanBtn" onclick="startScan()">
          <span class="btn-text">SCAN</span>
          <span class="btn-loading" style="display:none;">
            <span class="spinner"></span> SCANNING...
          </span>
        </button>
      </div>
      <div id="inputError" class="input-error"></div>
    </section>

    <!-- Status Terminal -->
    <section id="terminal" class="terminal" style="display:none;">
      <div class="terminal-header">
        <span class="terminal-dot red"></span>
        <span class="terminal-dot yellow"></span>
        <span class="terminal-dot green"></span>
        <span class="terminal-title">scan_output</span>
      </div>
      <div id="terminalContent" class="terminal-content">
      </div>
    </section>

    <!-- Results -->
    <section id="results" class="results" style="display:none;">
      <!-- Page Info -->
      <div id="pageInfo" class="page-info"></div>

      <!-- Stats -->
      <div id="stats" class="stats-bar"></div>

      <!-- Filter Tabs -->
      <div class="filter-tabs">
        <button class="filter-tab active" data-filter="all" onclick="filterAssets('all', this)">ALL</button>
        <button class="filter-tab" data-filter="video" onclick="filterAssets('video', this)">VIDEO</button>
        <button class="filter-tab" data-filter="stream" onclick="filterAssets('stream', this)">STREAM</button>
        <button class="filter-tab" data-filter="audio" onclick="filterAssets('audio', this)">AUDIO</button>
        <button class="filter-tab" data-filter="image" onclick="filterAssets('image', this)">IMAGE</button>
        <button class="filter-tab" data-filter="embedded" onclick="filterAssets('embedded', this)">EMBED</button>
      </div>

      <!-- Asset List -->
      <div id="assetList" class="asset-list"></div>
    </section>

    <!-- Download Queue -->
    <section id="downloadQueue" class="download-queue" style="display:none;">
      <div class="section-header">
        <span class="section-icon">&#9660;</span>
        <span>DOWNLOAD QUEUE</span>
        <button class="clear-queue-btn" onclick="clearQueue()">CLEAR</button>
      </div>
      <div id="queueList" class="queue-list"></div>
    </section>

    <!-- History -->
    <section id="historySection" class="history-section">
      <div class="section-header clickable" onclick="toggleHistory()">
        <span class="section-icon" id="historyIcon">&#9654;</span>
        <span>DOWNLOAD HISTORY</span>
        <span id="historyCount" class="history-count">0</span>
      </div>
      <div id="historyList" class="history-list" style="display:none;"></div>
    </section>

    <!-- Footer -->
    <footer class="footer">
      <span>WebGrab v1.0 &middot; Public assets only &middot; No DRM bypass</span>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
